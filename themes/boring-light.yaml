name: boring-light
label: "Boring Light"
description: "Flat, silent light mode. No noise. No vignette. No artisanal fonts."

palette:
  background:
    hex: "#ffffff"
    alpha: 1
  midground:
    hex: "#1a1a1a"
    alpha: 1
  foreground:
    hex: "#000000"
    alpha: 0
  warmGlow: "rgba(0, 0, 0, 0)"
  noiseOpacity: 0

typography:
  fontSans: 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif'
  fontMono: 'ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace'
  baseSize: "14px"
  lineHeight: "1.5"
  letterSpacing: "0"

layout:
  radius: "0.375rem"
  density: "comfortable"

colorOverrides:
  card: "#f6f8fa"
  border: "#d0d7de"
  input: "#f6f8fa"
  muted: "#f6f8fa"
  mutedForeground: "#656d76"
  primary: "#1a1a1a"
  primaryForeground: "#ffffff"
  secondary: "#f6f8fa"
  secondaryForeground: "#1a1a1a"
  accent: "#f6f8fa"

componentStyles:
  backdrop:
    fillerBlendMode: "normal"
    fillerOpacity: "0"

customCSS: |
  /* == FONTS == */
  .font-mondwest, [class*="font-mondwest"],
  .font-expanded, [class*="font-expanded"],
  .font-compressed, [class*="font-compressed"] {
    font-family: var(--theme-font-sans) !important;
    font-variant: normal !important;
    font-weight: 600 !important;
    text-transform: none !important;
    letter-spacing: 0.01em !important;
  }

  /* == BACKDROP ==
     On light themes the difference blend inverts everything — override all. */
  [style*="mix-blend-mode: difference"],
  [style*="mix-blend-mode: lighten"] {
    mix-blend-mode: normal !important;
  }

  .theme-default-filler {
    display: none !important;
  }

  [style*="radial-gradient"] {
    opacity: 0 !important;
  }

  .blend-lighter {
    mix-blend-mode: normal !important;
  }
